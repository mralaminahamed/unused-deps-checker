name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Self-test (zero dependencies)
        run: node test/run.mjs

      - name: Validate sample config against schema
        run: node scripts/validate-config.mjs

      - name: Smoke-run CLI on this repo
        run: node bin/check-deps.mjs --root . --js-only
